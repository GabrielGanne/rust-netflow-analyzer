[package]
name = "netflow_analyzer_core"
version = "0.1.0"
edition = "2021"
description = "Zero-copy NetFlow v5/v9 and IPFIX decoding and flow-aggregation engine."
readme = "README.md"
keywords = ["netflow", "ipfix", "network", "monitoring", "flow"]
categories = ["network-programming", "parser-implementations"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nom = "7.1"
dashmap = "6.0"

[dev-dependencies]
criterion = "0.5"

# The reference OS-socket listener lives at the workspace root per the project
# layout; expose it as a runnable example of the core crate.
[[example]]
name = "udp_listener"
path = "../examples/udp_listener.rs"

[[bench]]
name = "process_packet"
harness = false
