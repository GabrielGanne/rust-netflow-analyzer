[package]
name = "netflow_analyzer_core"
version = "0.3.0"
edition = "2021"
description = "Zero-copy NetFlow v5/v9 and IPFIX decoding and flow-aggregation engine."
readme = "README.md"
keywords = ["netflow", "ipfix", "network", "monitoring", "flow"]
categories = ["network-programming", "parser-implementations"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
nom = "8.0"
dashmap = "6.2"

[dev-dependencies]
criterion = "0.7"

# The reference OS-socket listener in `examples/udp_listener.rs` is auto-discovered
# by cargo and packaged with the crate; no explicit `[[example]]` target needed.

[[bench]]
name = "process_packet"
harness = false
