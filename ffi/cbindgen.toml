# cbindgen configuration for the netflow_analyzer_ffi crate.
# Generate with:  make header   (or)   cbindgen --config ffi/cbindgen.toml \
#                                         --crate netflow_analyzer_ffi \
#                                         --output ffi/include/netflow-analyzer.h

language = "C"
header = """
/* This Source Code Form is subject to the terms of the Mozilla Public
 * License, v. 2.0. If a copy of the MPL was not distributed with this
 * file, You can obtain one at https://mozilla.org/MPL/2.0/. */"""
pragma_once = true
autogen_warning = "/* This file is auto-generated by cbindgen. Do not edit by hand. */"
include_guard = "NETFLOW_ANALYZER_H"
tab_width = 4
style = "type"
cpp_compat = true

[parse]
parse_deps = true
include = ["netflow_analyzer_core"]

[export]
include = [
    "NetflowAnalyzerConfig",
    "NetflowAnalyzerContext",
    "NetflowAnalyzerFlowRecord",
    "NetflowAnalyzerStats",
]
# Internal core types that are reachable through the parsed dependency but are
# not part of the C ABI (they never appear in an exported function signature).
exclude = [
    "SamplingRatio",
    "SamplerSelector",
    "SamplingObservation",
]
prefix = ""

[enum]
rename_variants = "QualifiedScreamingSnakeCase"

[fn]
sort_by = "None"

[defines]
