[package]
name = "netflow_analyzer_ffi"
version = "0.2.0"
edition = "2021"
description = "C ABI (FFI) bindings for the netflow_analyzer_core NetFlow/IPFIX engine."
readme = "README.md"
keywords = ["netflow", "ipfix", "ffi", "c-bindings", "network"]
categories = ["network-programming", "external-ffi-bindings"]
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
# `version` is required for publishing: cargo builds against the local `path`
# in-workspace, but rewrites the dependency to this registry requirement in the
# published `.crate`. It must track core's version, so core has to be published
# first (see RELEASING.md).
netflow_analyzer_core = { path = "../core", version = "0.2.0" }
